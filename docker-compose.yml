version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: resume-tailor-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Narendra8341896988
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:Narendra8341896988@db:5432/postgres
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  notification-worker:
    build: ./backend
    command: ["python", "notification_worker.py"]
    environment:
      DATABASE_URL: postgresql://postgres:Narendra8341896988@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
